backend:
  name: git-gateway
  branch: main

# Фото и видео, загруженные через админку, попадают сюда
media_folder: "media/uploads"
public_folder: "/media/uploads"

publish_mode: simple

collections:
  - name: "journal"
    label: "Дневник путешествий"
    files:
      - name: "trips"
        label: "Все записи"
        file: "data/trips.json"
        fields:

          - label: "Цитата на главной"
            name: "quote"
            widget: "object"
            collapsed: true
            fields:
              - label: "Текст цитаты"
                name: "text"
                widget: "text"
                hint: "Одно-два предложения. Кавычки ставить не нужно — они добавятся сами."
              - label: "Кто сказал"
                name: "who"
                widget: "string"
                hint: "Заглавными буквами. Например: MY WIFE"

          - label: "Поездки и выходные"
            name: "trips"
            widget: "list"
            label_singular: "Запись"
            summary: "{{fields.date}} · {{fields.title}}"
            fields:

              - label: "ID (техническое имя)"
                name: "id"
                widget: "string"
                hint: "Латиницей, без пробелов и заглавных букв. Так же должна называться папка в media/. Пример: italy-2027"
                pattern: ['^[a-z0-9-]+$', "Только латинские строчные буквы, цифры и дефис"]

              - label: "Тип записи"
                name: "type"
                widget: "select"
                default: "trip"
                hint: "Поездка — большой блок с фото на главной. Выходные — маленький квадрат в отдельной сетке."
                options:
                  - { label: "Поездка (большая)", value: "trip" }
                  - { label: "Выходные (короткая)", value: "weekend" }

              - label: "Название"
                name: "title"
                widget: "string"
                hint: "Как будет написано крупным заголовком. Пример: Croatia"

              - label: "Страна"
                name: "country"
                widget: "string"
                hint: "По-английски, одним словом или коротко. По этому полю на главной сами собираются кнопки-фильтры. Примеры: Croatia / Italy / Czech Republic"

              - label: "Когда (год и месяц)"
                name: "date"
                widget: "string"
                hint: "Строго в формате ГОД-МЕСЯЦ, четыре цифры, дефис, две цифры. Пример: 2027-08 — это август 2027. По этому полю сайт сам расставляет записи по порядку и сам пишет 'August 2027' где нужно."
                pattern: ['^\d{4}-(0[1-9]|1[0-2])$', "Нужен формат 2027-08"]

              - label: "Время года"
                name: "season"
                widget: "select"
                default: "Summer"
                hint: "Год подставится сам. Выберешь Summer — на странице будет 'Summer 2027'."
                options:
                  - { label: "Весна — Spring", value: "Spring" }
                  - { label: "Лето — Summer", value: "Summer" }
                  - { label: "Осень — Autumn", value: "Autumn" }
                  - { label: "Зима — Winter", value: "Winter" }

              - label: "Сколько дней"
                name: "days"
                widget: "number"
                value_type: "int"
                required: false
                default: 0
                hint: "Просто число. Оставь 0 или пусто — тогда на странице ничего про дни написано не будет."

              - label: "С кем ездили"
                name: "people"
                widget: "string"
                default: "with my wife"
                hint: "По-английски, с маленькой буквы. Примеры: with my wife / with friends & my wife"

              - label: "Места"
                name: "places"
                widget: "string"
                hint: "Города или районы через запятую, по-английски. Пример: Trogir, the islands"

              - label: "Координаты на карте"
                name: "geo"
                widget: "geosearch"
                hint: "Напиши название места и нажми 'Найти' — координаты подставятся сами."

              - label: "Обложка (фото для карточки на главной)"
                name: "cover"
                widget: "image"
                required: false
                hint: "Вертикальное фото. Если не загрузишь — на сайте будет аккуратная заглушка, ничего не сломается."

              - label: "Обложка — текст заглушки"
                name: "coverAlt"
                widget: "string"
                required: false
                hint: "Видно только пока фото не загружено. Пример: PHOTO · Trogir old town from the water"

              - label: "Широкое фото в шапку страницы"
                name: "hero"
                widget: "image"
                required: false
                hint: "Горизонтальное фото на всю ширину экрана."

              - label: "Шапка — текст заглушки"
                name: "heroAlt"
                widget: "string"
                required: false

              - label: "Короткое описание"
                name: "excerpt"
                widget: "text"
                hint: "Одно-два предложения по-английски. Показывается в списке на главной, под названием."

              - label: "Вступительный абзац"
                name: "intro"
                widget: "text"
                required: false
                hint: "Крупный текст в начале страницы поездки. Здесь можно написать побольше."

              - label: "Фото и видео"
                name: "media"
                widget: "list"
                label_singular: "Кадр"
                required: false
                summary: "{{fields.kind}} — {{fields.alt}}"
                hint: "Каждый кадр — отдельный блок. Порядок здесь = порядок на странице."
                fields:
                  - label: "Файл фото"
                    name: "src"
                    widget: "image"
                    required: false
                    hint: "Для видео с YouTube файл не нужен — оставь пустым и заполни поле ниже."

                  - label: "Это фото или видео"
                    name: "kind"
                    widget: "select"
                    default: "photo"
                    options:
                      - { label: "Фото", value: "photo" }
                      - { label: "Видео", value: "video" }

                  - label: "ID видео с YouTube"
                    name: "videoId"
                    widget: "string"
                    required: false
                    hint: "Только код из ссылки, после v=. Из youtube.com/watch?v=aBc123XyZ нужно вписать: aBc123XyZ"

                  - label: "Размер в мозаике"
                    name: "size"
                    widget: "select"
                    default: "square"
                    hint: "Чередуй размеры, чтобы страница выглядела живее."
                    options:
                      - { label: "Крупный — на две колонки", value: "big" }
                      - { label: "Широкий — панорама", value: "wide" }
                      - { label: "Вертикальный", value: "tall" }
                      - { label: "Квадратный", value: "square" }

                  - label: "Текст заглушки"
                    name: "alt"
                    widget: "string"
                    hint: "Видно, только пока файл не загружен. Пример: PHOTO · Leaving the harbour"

                  - label: "Подпись под кадром"
                    name: "caption"
                    widget: "string"
                    required: false
                    hint: "Необязательно. Одна строка по-английски."

                  - label: "Реплика"
                    name: "quote"
                    widget: "object"
                    required: false
                    collapsed: true
                    hint: "Необязательно. Ради этих реплик весь сайт и задуман — кто что сказал в этот момент."
                    fields:
                      - label: "Кто сказал"
                        name: "who"
                        widget: "string"
                        hint: "Заглавными. Примеры: WIFE / SAM / US"
                      - label: "Что сказал"
                        name: "text"
                        widget: "string"
                        hint: "Кавычки не нужны, добавятся сами."
