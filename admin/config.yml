backend:
  name: git-gateway
  branch: main

# Фото и видео, загруженные через админку, попадают сюда
media_folder: "media/uploads"
public_folder: "/media/uploads"

publish_mode: simple

# Имена файлов для новых поездок: латиница, без букв с точками
slug:
  encoding: "ascii"
  clean_accents: true

collections:

  # ------------------------------------------------------------------
  # 1. Поездки. Каждая — отдельный файл, слева получается список.
  #    Открываешь одну поездку — видишь форму только по ней.
  # ------------------------------------------------------------------
  - name: "trips"
    label: "Поездки"
    label_singular: "Поездка"
    folder: "data/trips"
    extension: "json"
    format: "json"
    create: true
    delete: true
    identifier_field: "title"
    slug: "{{fields.title}}-{{fields.date}}"
    summary: "{{fields.date}}  ·  {{fields.title}}"
    sortable_fields: ["date", "title"]
    fields:

      - label: "Название"
        name: "title"
        widget: "string"
        hint: "Крупный заголовок страницы. По-английски. Пример: Croatia"

      - label: "Когда (год и месяц)"
        name: "date"
        widget: "string"
        hint: "Четыре цифры года, дефис, две цифры месяца. Пример: 2027-08 — это август 2027. По этому полю сайт сам расставляет записи по порядку."
        pattern: ['^\d{4}-(0[1-9]|1[0-2])$', "Нужен формат 2027-08"]

      - label: "Тип записи"
        name: "type"
        widget: "select"
        default: "trip"
        hint: "Поездка — большой блок на главной. Выходные — маленький квадрат в отдельной сетке."
        options:
          - { label: "Поездка (большая)", value: "trip" }
          - { label: "Выходные (короткая)", value: "weekend" }

      - label: "Страна"
        name: "country"
        widget: "string"
        required: false
        hint: "По-английски. Из этого поля на главной сами собираются кнопки-фильтры. Примеры: Croatia / Italy / Czech Republic"

      # ---------- группа: детали поездки ----------
      - label: "Детали поездки"
        name: "details"
        widget: "object"
        collapsed: true
        required: false
        hint: "Мелочи под заголовком: время года, сколько дней, с кем, где. Всё необязательно."
        fields:
          - label: "Время года"
            name: "season"
            widget: "select"
            required: false
            default: "Summer"
            hint: "Год подставится сам: выберешь Summer — на странице будет 'Summer 2027'."
            options:
              - { label: "Весна — Spring", value: "Spring" }
              - { label: "Лето — Summer", value: "Summer" }
              - { label: "Осень — Autumn", value: "Autumn" }
              - { label: "Зима — Winter", value: "Winter" }

          - label: "Сколько дней"
            name: "days"
            widget: "number"
            value_type: "int"
            required: false
            default: 0
            hint: "Оставь 0 — тогда про дни на странице ничего написано не будет."

          - label: "С кем ездили"
            name: "people"
            widget: "string"
            required: false
            default: "with my wife"
            hint: "По-английски, с маленькой буквы. Примеры: with my wife / with friends & my wife"

          - label: "Места"
            name: "places"
            widget: "string"
            required: false
            hint: "Города или районы через запятую, по-английски. Пример: Trogir, the islands"

          - label: "Точка на карте"
            name: "geo"
            widget: "geosearch"
            required: false
            hint: "Напиши название места и нажми «Найти» — координаты подставятся сами."

      # ---------- группа: обложки ----------
      - label: "Обложки"
        name: "covers"
        widget: "object"
        collapsed: true
        required: false
        hint: "Два фото: вертикальное для карточки на главной и горизонтальное на всю ширину в шапку страницы."
        fields:
          - label: "Обложка для главной (вертикальная)"
            name: "cover"
            widget: "image"
            required: false

          - label: "Обложка — текст, пока фото нет"
            name: "coverAlt"
            widget: "string"
            required: false
            hint: "Видно только пока фото не загружено. Пример: PHOTO · Trogir old town from the water"

          - label: "Шапка страницы (горизонтальная)"
            name: "hero"
            widget: "file"
            required: false
            hint: "Фото (.jpg/.png) или видео (.mp4/.mov) — крутится само, без звука."

          - label: "Шапка — текст, пока фото нет"
            name: "heroAlt"
            widget: "string"
            required: false

      # ---------- группа: тексты ----------
      - label: "Тексты"
        name: "text"
        widget: "object"
        collapsed: true
        required: false
        hint: "Короткое описание для списка на главной и большой вступительный абзац на самой странице."
        fields:
          - label: "Короткое описание (для списка на главной)"
            name: "excerpt"
            widget: "text"
            required: false
            hint: "Одно-два предложения по-английски."

          - label: "Вступительный абзац (на странице поездки)"
            name: "intro"
            widget: "text"
            required: false
            hint: "Крупный текст в начале страницы. Здесь можно написать побольше."

      # ---------- фото ----------
      - label: "Фото и видео"
        name: "media"
        widget: "list"
        label_singular: "Кадр"
        required: false
        collapsed: true
        summary: "{{fields.src}}"
        hint: "Порядок здесь = порядок на странице. Справа в окне предпросмотра все кадры пронумерованы — по номеру и находи нужный. Как встанут в сетку, сайт решит сам, размеры выбирать не нужно."
        fields:
          - label: "Файл"
            name: "src"
            widget: "file"
            required: false
            hint: "Фото (.jpg/.png) или видеофайл (.mp4/.mov). Для видео с YouTube оставь пустым и заполни поле ниже."

          - label: "Подпись под кадром"
            name: "caption"
            widget: "string"
            required: false
            hint: "Необязательно. Одна строка по-английски."

          - label: "Реплика"
            name: "quote"
            widget: "object"
            required: false
            collapsed: true
            hint: "Ради этих реплик всё и затевалось. Кадр с репликой сайт всегда ставит во всю ширину."
            fields:
              - label: "Кто сказал"
                name: "who"
                widget: "string"
                required: false
                hint: "Заглавными. Примеры: WIFE / SAM / US"
              - label: "Что сказал"
                name: "text"
                widget: "string"
                required: false
                hint: "Кавычки не нужны, добавятся сами."

          - label: "ID видео с YouTube"
            name: "youtubeId"
            widget: "string"
            required: false
            hint: "Нужно только для видео с YouTube. Из ссылки youtube.com/watch?v=aBc123XyZ вписать: aBc123XyZ"

  # ------------------------------------------------------------------
  # 2. Цитата на главной. Одна короткая форма, ничего больше.
  # ------------------------------------------------------------------
  - name: "site"
    label: "Главная страница"
    editor:
      preview: false
    files:
      - name: "quote"
        label: "Цитата на главной"
        file: "data/site.json"
        fields:
          - label: "Цитата"
            name: "quote"
            widget: "object"
            fields:
              - label: "Текст цитаты"
                name: "text"
                widget: "text"
                required: false
                hint: "Одно-два предложения. Кавычки ставить не нужно — они добавятся сами."
              - label: "Кто сказал"
                name: "who"
                widget: "string"
                required: false
                hint: "Заглавными буквами. Например: MY WIFE"
