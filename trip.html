<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Work+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:oklch(97% 0.008 75);
  --ink:oklch(18% 0.01 60);
  --ink-2:oklch(45% 0.015 60);
  --ink-3:oklch(50% 0.015 60);
  --rule:oklch(85% 0.01 70);
  --accent:oklch(56% 0.14 38);
  --accent-lite:oklch(70% 0.13 40);
  --dark:oklch(14% 0.01 60);
  --cream:oklch(97% 0.006 75);
  --serif:'Bodoni Moda',Georgia,serif;
  --sans:'Work Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --pad:clamp(20px,5vw,48px);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
img,video{display:block;max-width:100%}
::selection{background:oklch(56% 0.14 38 / 0.25)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.ph{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(45deg,oklch(90% 0.012 70) 0px,oklch(90% 0.012 70) 2px,
    oklch(95% 0.008 75) 2px,oklch(95% 0.008 75) 14px)}
.ph.sea{background:repeating-linear-gradient(45deg,oklch(58% 0.06 220) 0px,oklch(58% 0.06 220) 2px,
    oklch(52% 0.055 218) 2px,oklch(52% 0.055 218) 16px)}
.ph>span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:oklch(48% 0.02 60);text-align:center;padding:0 16px}
.ph.sea>span{color:oklch(94% 0.01 100 / .8);font-size:12px;letter-spacing:.1em}
.ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.playmark{position:absolute;top:16px;right:16px;width:52px;height:52px;border-radius:50%;
  border:1.5px solid oklch(48% 0.02 60);display:flex;align-items:center;justify-content:center}
.playmark i{width:0;height:0;border-style:solid;border-width:7px 0 7px 11px;
  border-color:transparent transparent transparent oklch(48% 0.02 60)}

nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:22px var(--pad);background:oklch(14% 0.01 60 / .42);backdrop-filter:blur(12px)}
nav .logo{font-family:var(--serif);font-size:20px;letter-spacing:.08em;color:var(--cream)}
nav .links{display:flex;gap:clamp(16px,3vw,36px)}
nav .links a{font-size:13px;letter-spacing:.04em;color:oklch(94% 0.006 75)}
nav .links a:hover{color:var(--accent-lite)}

.cover{position:relative;height:92svh;min-height:560px;overflow:hidden}
.cover .ph{position:absolute;inset:0}
.cover .veil{position:absolute;inset:0;background:linear-gradient(180deg,
  oklch(14% 0.01 60 / .1) 0%,oklch(14% 0.01 60 / .8) 100%)}
.cover .txt{position:absolute;bottom:0;left:0;right:0;padding:0 var(--pad) clamp(40px,7vh,64px)}
.cover .coords{font-family:var(--mono);font-size:12px;letter-spacing:.08em;
  color:oklch(80% 0.02 60);margin-bottom:16px}
.cover h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,7vw,96px);line-height:.98;
  color:var(--cream);margin-bottom:20px}
.cover .facts{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:oklch(88% 0.01 65)}

.intro{padding:clamp(60px,10vh,120px) var(--pad) clamp(40px,7vh,80px);max-width:900px;margin:0 auto}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin-bottom:24px}
.intro p{font-family:var(--serif);font-weight:400;font-size:clamp(21px,2.6vw,30px);line-height:1.45;
  text-wrap:pretty}

/* ---------------------------------------------------------------
   ГАЛЕРЕЯ
   Кадры собираются в горизонтальные ряды по 1, 2 или 3 штуки.
   Внутри ряда высота у всех одинаковая, а ширина — по пропорциям
   самого снимка (flex-grow = ширина/высота). Поэтому ничего
   не обрезается и не остаётся пустых углов.
   Сколько кадров в ряду — решает скрипт, исходя из их количества.
   --------------------------------------------------------------- */
.gal{padding:0 var(--pad) clamp(70px,12vh,140px);max-width:1400px;margin:0 auto}
.band{display:flex;align-items:flex-start;
  gap:clamp(10px,1.1vw,16px);margin-bottom:clamp(14px,1.6vw,24px)}
.band.solo{display:block}
.band.solo .fig{max-width:100%}
.fig{flex:1 1 0;min-width:0}
.fig .box{position:relative;overflow:hidden;aspect-ratio:3/2;
  background:oklch(93% 0.008 75)}
.fig .box img,.fig .box video,.fig .box iframe{position:absolute;inset:0;
  width:100%;height:100%;object-fit:cover;border:0}
.fig .box.zoom{cursor:zoom-in}
.fig .box.zoom::after{content:"";position:absolute;inset:0;
  background:oklch(14% 0.01 60/0);transition:background .25s ease}
.fig .box.zoom:hover::after{background:oklch(14% 0.01 60/.1)}
.fig .cap{padding:12px 2px 0}
.fig .cap p{font-size:14px;line-height:1.6;font-weight:300;color:var(--ink-2)}
.fig .cap .q{font-family:var(--mono);font-size:12px;color:var(--accent);
  line-height:1.5;margin-top:6px}
/* кадр во всю ширину с репликой — реплика становится крупнее, ради неё всё и затевалось */
.band.solo .fig .cap{max-width:70ch}
.band.solo .fig .cap .q{font-size:13px}
/* заглушка, когда файла ещё нет */
.fig .box.empty{background:repeating-linear-gradient(45deg,oklch(90% 0.012 70) 0px,
  oklch(90% 0.012 70) 2px,oklch(95% 0.008 75) 2px,oklch(95% 0.008 75) 14px);
  display:flex;align-items:center;justify-content:center}
.fig .box.empty>span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:oklch(48% 0.02 60);text-align:center;padding:0 16px}

@media(max-width:700px){
  .band{display:block;margin-bottom:0}
  .band .fig{margin-bottom:clamp(20px,5vw,32px)}
}

/* лайтбокс */
.lb{position:fixed;inset:0;z-index:200;background:oklch(12% 0.008 60/.97);
  display:none;flex-direction:column;backdrop-filter:blur(2px)}
.lb.on{display:flex}
.lb .stage{flex:1;display:flex;align-items:center;justify-content:center;
  padding:clamp(48px,8vh,80px) clamp(16px,7vw,110px) 8px;min-height:0}
.lb .stage img,.lb .stage video{max-width:100%;max-height:100%;
  width:auto;height:auto;object-fit:contain}
.lb .bar{padding:0 clamp(16px,7vw,110px) clamp(24px,5vh,40px);
  display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.lb .txt{color:oklch(90% 0.006 75);max-width:70ch}
.lb .txt p{font-size:14px;font-weight:300;line-height:1.6}
.lb .txt .q{font-family:var(--mono);font-size:12px;color:var(--accent-lite);margin-top:6px}
.lb .count{font-family:var(--mono);font-size:12px;letter-spacing:.08em;
  color:oklch(65% 0.01 60);white-space:nowrap}
.lb button{position:absolute;background:none;border:0;cursor:pointer;
  color:oklch(92% 0.006 75);font-family:var(--mono);font-size:22px;line-height:1;
  padding:14px 18px;transition:color .2s}
.lb button:hover{color:var(--accent-lite)}
.lb .close{top:10px;right:8px;font-size:26px}
.lb .prev{left:0;top:50%;transform:translateY(-50%)}
.lb .next{right:0;top:50%;transform:translateY(-50%)}
@media(max-width:700px){
  .lb .prev,.lb .next{top:auto;bottom:0;transform:none}
  .lb .next{right:8px}
  .lb .prev{left:8px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

.wheresec{padding:0 var(--pad) clamp(70px,12vh,140px);max-width:1400px;margin:0 auto}
.wheresec .head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;
  gap:16px;margin-bottom:32px}
.wheresec h2{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3vw,36px)}
.wheresec .meta{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--ink-3)}
#map{height:min(46svh,420px);width:100%;border:1px solid var(--rule);background:oklch(93% 0.008 75)}
.leaflet-container{font-family:var(--sans);background:oklch(93% 0.008 75)}
.pin{width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--cream);
  box-shadow:0 0 0 4px oklch(56% 0.14 38 / .22)}

.pager{padding:0 var(--pad) clamp(70px,12vh,140px);max-width:1400px;margin:0 auto}
.pager .head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;
  gap:16px;margin-bottom:40px}
.pager h2{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3vw,36px)}
.pnav{display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.pnav a{font-size:14px;letter-spacing:.02em;border-bottom:1px solid var(--ink);padding-bottom:3px}
.pnav a:hover{color:var(--accent);border-color:var(--accent)}

footer{background:var(--dark);color:oklch(90% 0.006 75);padding:clamp(40px,7vh,56px) var(--pad) 40px}
footer .in{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}
footer .logo{font-family:var(--serif);font-size:20px}
footer .copy{font-size:12px;color:oklch(55% 0.01 60)}

.missing{max-width:800px;margin:0 auto;padding:26svh var(--pad) 22svh;text-align:center}
.missing h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,44px);margin-bottom:20px}
.missing a{font-size:14px;border-bottom:1px solid var(--ink);padding-bottom:3px}

@media(max-width:640px){
  nav{padding:16px var(--pad)}
  nav .links a:nth-child(n+3){display:none}
}
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">Journal</a>
  <div class="links">
    <a href="index.html">Home</a>
    <a href="index.html#weekends">Weekends</a>
    <a href="index.html#archive">All entries</a>
  </div>
</nav>

<main id="app"></main>

<footer>
  <div class="in">
    <div class="logo">Journal</div>
    <div class="copy">© <span id="yr"></span> Our travel archive</div>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); };
document.getElementById("yr").textContent = new Date().getFullYear();

fetch("data/trips.json")
  .then(function(r){ return r.json(); })
  .then(function(DATA){ init(DATA.trips || []); })
  .catch(function(err){
    console.error("Could not load trips.json", err);
    $("#app").innerHTML = '<div class="missing"><h1>Could not load this page.</h1>'+
      '<a href="index.html">← All entries</a></div>';
  });

function init(TRIPS) {

var MONTHS = ["January","February","March","April","May","June",
              "July","August","September","October","November","December"];

function yearOf(t){
  return t.year || parseInt(String(t.date||"").slice(0,4), 10) || 0;
}
function datesOf(t){
  if (t.dates) return t.dates;
  var m = /^(\d{4})-(\d{2})$/.exec(t.date || "");
  if (!m) return "";
  return MONTHS[parseInt(m[2],10)-1] + " " + m[1];
}
function coordsOf(t){
  if (typeof t.geo === "string" && t.geo.indexOf(",") > -1) {
    var p = t.geo.split(",");
    var la = parseFloat(p[0]), ln = parseFloat(p[1]);
    if (!isNaN(la) && !isNaN(ln)) return [la, ln];
  }
  if (typeof t.lat === "number" && typeof t.lng === "number") return [t.lat, t.lng];
  return null;
}
/* "Summer" + год -> "Summer 2026"; если уже с цифрами, оставляем как есть */
function seasonOf(t){
  if (!t.season) return "";
  return /\d/.test(t.season) ? t.season : t.season + " " + yearOf(t);
}
/* координатная подпись 43\u00b031' N 16\u00b015' E собирается из координат */
function dms(v, pos, neg){
  var hemi = v >= 0 ? pos : neg;
  v = Math.abs(v);
  var d = Math.floor(v), m = Math.round((v - d) * 60);
  if (m === 60) { d++; m = 0; }
  return d + "\u00b0" + (m < 10 ? "0" : "") + m + "' " + hemi;
}
function coordLabel(t){
  if (t.coords) return t.coords;
  var c = coordsOf(t);
  if (!c) return "";
  return dms(c[0], "N", "S") + " " + dms(c[1], "E", "W");
}

/* ---------------- ГАЛЕРЕЯ ---------------- */

var VIDEO_EXT = /\.(mp4|mov|webm|m4v)$/i;

function isVideo(m){
  return m.kind === "video" || !!m.videoId || VIDEO_EXT.test(m.src || "");
}
function hasQuote(m){
  return !!(m.quote && m.quote.text);
}

/* Разбивка кадров на ряды.
   Ряд из 1 кадра — крупная пауза, из 2-3 — плотнее.
   Видео и кадры с репликой всегда идут одни, во всю ширину. */
function planBands(items){
  var n = items.length, i = 0, p = 0, plan = [];

  /* ритм рядов: чем больше кадров, тем плотнее */
  var pattern = n <= 2  ? [1]
              : n <= 6  ? [1, 2, 2]
              : n <= 12 ? [1, 2, 3, 2]
              :           [1, 3, 2, 3, 3];

  function alone(k){ return isVideo(items[k]) || hasQuote(items[k]); }

  while (i < n) {
    if (alone(i)) { plan.push([i]); i++; continue; }

    /* сколько обычных кадров идёт подряд до ближайшего видео/реплики */
    var run = 0;
    while (i + run < n && !alone(i + run)) run++;

    var want = pattern[p % pattern.length]; p++;
    if (want > run) want = run;
    /* если после этого ряда останется ровно один кадр — перекраиваем,
       чтобы он не повис в конце в одиночестве */
    else if (run - want === 1) want = (want < 3) ? want + 1 : want - 1;

    var band = [];
    for (var k = 0; k < want; k++) { band.push(i); i++; }
    plan.push(band);
  }
  return plan;
}

function figure(m, i){
  var box, zoom = "";

  if (m.videoId) {
    box = '<div class="box" style="aspect-ratio:16/9">'+
      '<iframe src="https://www.youtube-nocookie.com/embed/'+esc(m.videoId)+
      '" title="'+esc(m.caption || m.alt || "Video")+
      '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"'+
      ' allowfullscreen loading="lazy"></iframe></div>';
  } else if (m.src && isVideo(m)) {
    box = '<div class="box" style="aspect-ratio:16/9">'+
      '<video src="'+esc(m.src)+'" muted loop playsinline controls preload="metadata"></video></div>';
  } else if (m.src) {
    zoom = ' zoom';
    box = '<div class="box'+zoom+'" data-i="'+i+'">'+
      '<img src="'+esc(m.src)+'" alt="'+esc(m.caption || m.alt || "")+'" loading="lazy"></div>';
  } else {
    box = '<div class="box empty"><span>'+esc(m.alt || "PHOTO")+'</span></div>';
  }

  var cap = "";
  if (m.caption || hasQuote(m)) {
    cap = '<div class="cap">'+
      (m.caption ? '<p>'+esc(m.caption)+'</p>' : '')+
      (hasQuote(m) ? '<div class="q">'+esc(m.quote.who || "")+
        (m.quote.who ? ": " : "")+'\u201c'+esc(m.quote.text)+'\u201d</div>' : '')+
    '</div>';
  }
  return '<figure class="fig">'+box+cap+'</figure>';
}

/* Пропорции кадра известны только после загрузки файла.
   До этого все кадры показываются как 3:2 — поэтому страница не прыгает.
   После загрузки ставим настоящие пропорции и ширину внутри ряда. */
function fitFrames(){
  var gal = document.getElementById("gal");
  if (!gal) return;

  function apply(img){
    var w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) return;
    var box = img.parentNode, fig = box && box.parentNode;
    if (!box || !fig) return;
    box.style.aspectRatio = w + " / " + h;
    fig.style.flexGrow = (w / h).toFixed(4);
  }

  var imgs = gal.querySelectorAll(".box img");
  for (var n = 0; n < imgs.length; n++) {
    var img = imgs[n];
    if (img.complete && img.naturalWidth) { apply(img); continue; }
    img.addEventListener("load", function(){ apply(this); });
    img.addEventListener("error", function(){
      /* файла нет — вместо битой картинки аккуратная заглушка */
      var box = this.parentNode;
      if (!box) return;
      box.className = "box empty";
      box.removeAttribute("data-i");
      box.innerHTML = '<span>'+esc(this.getAttribute("alt") || "PHOTO")+'</span>';
    });
  }
}

/* Просмотр во весь экран: клик по фото, стрелки, Esc, свайп */
function wireLightbox(frames){
  var gal = document.getElementById("gal");
  if (!gal) return;

  var shots = [];
  for (var n = 0; n < frames.length; n++) {
    if (frames[n].src && !isVideo(frames[n])) shots.push(n);
  }
  if (!shots.length) return;

  var lb = document.createElement("div");
  lb.className = "lb";
  lb.innerHTML =
    '<button class="close" aria-label="Close">\u00d7</button>'+
    '<button class="prev" aria-label="Previous">\u2190</button>'+
    '<button class="next" aria-label="Next">\u2192</button>'+
    '<div class="stage"><img alt=""></div>'+
    '<div class="bar"><div class="txt"></div><div class="count"></div></div>';
  document.body.appendChild(lb);

  var img = lb.querySelector(".stage img");
  var txt = lb.querySelector(".txt");
  var count = lb.querySelector(".count");
  var pos = 0;

  function show(k){
    pos = (k + shots.length) % shots.length;
    var m = frames[shots[pos]];
    img.src = m.src;
    img.alt = m.caption || m.alt || "";
    txt.innerHTML =
      (m.caption ? '<p>'+esc(m.caption)+'</p>' : '')+
      (hasQuote(m) ? '<div class="q">'+esc(m.quote.who || "")+
        (m.quote.who ? ": " : "")+'\u201c'+esc(m.quote.text)+'\u201d</div>' : '');
    count.textContent = (pos + 1) + " / " + shots.length;
  }
  function open(frameIndex){
    var k = shots.indexOf(frameIndex);
    if (k === -1) return;
    show(k);
    lb.classList.add("on");
    document.body.style.overflow = "hidden";
  }
  function close(){
    lb.classList.remove("on");
    document.body.style.overflow = "";
    img.src = "";
  }

  gal.addEventListener("click", function(e){
    var box = e.target.closest ? e.target.closest(".box.zoom") : null;
    if (!box) return;
    open(parseInt(box.getAttribute("data-i"), 10));
  });

  lb.querySelector(".close").addEventListener("click", close);
  lb.querySelector(".prev").addEventListener("click", function(){ show(pos - 1); });
  lb.querySelector(".next").addEventListener("click", function(){ show(pos + 1); });
  lb.addEventListener("click", function(e){
    if (e.target === lb || e.target.classList.contains("stage")) close();
  });
  document.addEventListener("keydown", function(e){
    if (!lb.classList.contains("on")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") show(pos - 1);
    if (e.key === "ArrowRight") show(pos + 1);
  });

  /* свайп на телефоне */
  var x0 = null;
  lb.addEventListener("touchstart", function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  lb.addEventListener("touchend", function(e){
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) show(pos + (dx < 0 ? 1 : -1));
    x0 = null;
  }, {passive:true});
}

var sorted = TRIPS.slice().sort(function(a,b){
  var da = a.date || (a.year + "-01");
  var db = b.date || (b.year + "-01");
  return db.localeCompare(da);
});

var id = new URLSearchParams(location.search).get("id");
var i = -1;
for (var k = 0; k < sorted.length; k++) { if (sorted[k].id === id) { i = k; break; } }

if (i === -1) {
  $("#app").innerHTML = '<div class="missing"><h1>This page does not exist yet.</h1>'+
    '<a href="index.html">← All entries</a></div>';
} else {
  var t = sorted[i];
  var prev = sorted[i+1], next = sorted[i-1];
  document.title = t.title + " — Journal";

  var facts = [];
  if (t.season) facts.push(esc(seasonOf(t)));
  if (t.days > 0) facts.push(t.days + " days");
  if (t.people) facts.push(esc(t.people));

  var html = "";

  html += '<section class="cover">'+
    '<div class="ph sea"><span>'+esc(t.heroAlt || "PHOTO")+'</span>'+
      (t.hero ? '<img src="'+t.hero+'" alt="'+esc(t.title)+'" onerror="this.remove()">' : '')+
    '</div>'+
    '<div class="veil"></div>'+
    '<div class="txt">'+
      '<div class="coords">'+esc(coordLabel(t))+
        (coordLabel(t) && t.places ? ' &nbsp;—&nbsp; ' : '')+
        esc(String(t.places||"").toUpperCase())+'</div>'+
      '<h1>'+esc(t.title)+'</h1>'+
      '<div class="facts">'+facts.join('<span>·</span>')+'</div>'+
    '</div>'+
  '</section>';

  if (t.intro) {
    html += '<section class="intro"><div class="eyebrow">About the trip</div>'+
      '<p>'+esc(t.intro)+'</p></section>';
  }

  var FRAMES = (t.media || []).filter(function(m){ return m && (m.src || m.videoId || m.alt); });

  if (FRAMES.length) {
    html += '<section class="gal" id="gal">'+ planBands(FRAMES).map(function(band){
      return '<div class="band'+(band.length === 1 ? ' solo' : '')+'">'+
        band.map(function(i){ return figure(FRAMES[i], i); }).join("")+
      '</div>';
    }).join("") + '</section>';
  }

  if (coordsOf(t)) {
    html += '<section class="wheresec"><div class="head"><h2>Where this was</h2>'+
      '<div class="meta">'+esc(String(t.places||"").toUpperCase())+'</div></div>'+
      '<div id="map"></div></section>';
  }

  html += '<section class="pager"><div class="head"><h2>Other trips</h2></div><div class="pnav">'+
    (prev ? '<a href="trip.html?id='+prev.id+'">← '+esc(prev.title)+'</a>' : '')+
    (next ? '<a href="trip.html?id='+next.id+'">'+esc(next.title)+' →</a>' : '')+
    '<a href="index.html#archive">All entries</a>'+
  '</div></section>';

  $("#app").innerHTML = html;

  fitFrames();
  wireLightbox(FRAMES);

  var cc = coordsOf(t);
  if (cc) {
    var map = L.map('map', { scrollWheelZoom:false }).setView(cc, 8);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
      attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:18
    }).addTo(map);
    L.marker(cc, {
      icon: L.divIcon({ className:'', html:'<div class="pin"></div>', iconSize:[11,11], iconAnchor:[5,5] })
    }).addTo(map);
    map.on('click', function(){ map.scrollWheelZoom.enable(); });
    map.on('mouseout', function(){ map.scrollWheelZoom.disable(); });
  }
}

} /* конец init() */
</script>
</body>
</html>
